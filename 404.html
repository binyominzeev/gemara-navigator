<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Gemara Navigator</title>
  <script>
    // GitHub Pages SPA redirect: preserve the path so the app can restore state.
    // Paths under /tursa/* are redirected to /tursa.html; all others go to the app root /.
    var path = window.location.pathname;
    sessionStorage.setItem('redirect', path);
    if (path.startsWith('/tursa')) {
      window.location.replace('/tursa.html');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
