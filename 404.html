<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Gemara Navigator</title>
  <script>
    // GitHub Pages SPA redirect: preserve the path so the app can restore state.
    // Paths under /tursa/* are redirected to /tursa.html; all others go to the app root /.
    var path = window.location.pathname;
    sessionStorage.setItem('redirect', path);
    if (path.startsWith('/tursa')) {
      window.location.replace('/tursa.html');
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
